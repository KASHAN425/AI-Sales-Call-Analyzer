<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sales Intelligence CRM</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-page-container">
        <main class="auth-card">
            <div class="brand">
                <div class="brand-icon">CRM</div>
                <div>
                    <strong style="font-size:16px; color:#0f172a; font-weight:600;">Sales Intelligence CRM</strong>
                    <div style="font-size:11px; font-weight:500; color:#64748b; text-transform:uppercase;">Call Analytics Portal</div>
                </div>
            </div>

            <h1>Create Representative Account</h1>
            <p class="subtitle">Register to begin recording and auditing client calls</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        placeholder="Sarah Jenkins"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="rep@company.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Re-type your password"
                        required
                    >
                </div>

                <button type="submit" id="registerBtn" class="auth-btn">Create Account</button>
                <div class="message" id="registerMessage" role="status"></div>
            </form>

            <div class="bottom-link">
                Already registered?
                <a href="login.html">Sign in here</a>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script>
        const API_URL = window.API_URL || "http://127.0.0.1:8000";

        const registerForm = document.getElementById("registerForm");
        const registerBtn = document.getElementById("registerBtn");
        const registerMessage = document.getElementById("registerMessage");

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            registerMessage.style.color = "#dc2626";
            registerMessage.textContent = "";

            if (password !== confirmPassword) {
                registerMessage.textContent = "Passwords do not match.";
                return;
            }

            if (password.length < 8) {
                registerMessage.textContent = "Password must be at least 8 characters long.";
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = "Creating account...";

            try {
                const params = new URLSearchParams({
                    name: name,
                    email: email,
                    password: password
                });

                const response = await fetch(
                    `${API_URL}/auth/register?${params.toString()}`,
                    { method: "POST" }
                );

                const data = await response.json();

                if (!response.ok || data.success === false) {
                    throw new Error(
                        data.detail || data.error || "Registration failed."
                    );
                }

                sessionStorage.setItem("user_just_registered", "true");
                sessionStorage.setItem("registered_user_name", name);
                sessionStorage.setItem("registered_user_email", email);
                localStorage.removeItem("sales_onboarding_guide_seen");

                registerMessage.style.color = "#059669";
                registerMessage.textContent = "Account created successfully! Redirecting to login...";

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1000);

            } catch (error) {
                console.error("Registration error:", error);
                registerMessage.textContent = error.message || "Could not connect to the backend.";
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
